<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>PRODUCT</title>
</head>

<body>
    <header>
        <div class="logo">
            <a href="./index.html">
                <img src="./img/logo.jpeg" alt="En esta imagen podras ver el logo de LIM" class="logo_foto">
            </a>
        </div>
        <form class="busqueda" action="./search-results.html" method="GET">
            <input type="search" name="busqueda" value="">
            <button type="submit">Buscar</button>
        </form>
        <nav>
            <ul class="acceso">
                <li><a href="./index.html" class="home">Home</a></li>
                <li><a href="./login.html" class="login">Login</a></li>
                <li><a href="./register.html" class="register">Register</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <nav>
            <ul class="menu_vertical">
            </ul>
        </nav>
        <div class="catalogo">
            <section class="producto">
                <img src="" alt="" class="producto_foto">
                <article class="producto_datos">
                    <h1 class="producto_nombre"></h1>
                    <h3>Marca</h3>
                    <p class="producto_marca"></p>
                    <h3>Descripción</h3>
                    <p class="producto_descripcion"></p>
                    <h3>Precio</h3>
                    <p class="producto_precio"></p>
                    <h3>Categoría</h3>
                    <a href="" class="producto_categoria"></a>
                    <h3>Stock</h3>
                    <p class="producto_stock"></p>
                    <h3>Tags</h3>
                    <ul class="producto_tags">
                    </ul>
                </article>
            </section>
            <h2 class="index_titulo">Sección de Reviews</h2>
            <section class="reviews">
            </section>
        </div>
    </main>
    <footer>
        <p>Micaela Grinberg, Iosef Kier Joffe y Luana Sarfatis</p>
    </footer>
    <script src="./js/buscador.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/product.js"></script>
</body>

</html>
